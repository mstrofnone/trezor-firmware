
# cargo-vet audits file

[criteria.skimmed]
description = """
The crate has been partially reviewed — some `unsafe` blocks and/or some
logic, but not exhaustively. A best-effort low-risk check; not a substitute
for `safe-to-deploy` on security-critical crates.
"""

[criteria.unsafe-reviewed]
description = """
The crate's `unsafe` code has been reviewed and is sound. Safe-code logic
has NOT been audited; appropriate only for crates where a logic bug cannot
subvert security (e.g., cannot leak secrets, produce wrong cryptographic
output, or generate wrong wallet addresses).
"""
implies = "skimmed"

